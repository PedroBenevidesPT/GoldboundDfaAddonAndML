[alembic]
script_location = db/migrations
# Alembic owns the Postgres schema.  db/migrations/env.py replaces this with
# DATABASE_URL whenever that variable is set, which is how the stack and the
# worker run it; the value here is only the local default.
sqlalchemy.url = postgresql://goldbound:goldbound@localhost:5432/goldbound

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
